<!DOCTYPE html>
<html>
    <head>
        <title> BSIS Registration</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>

        <header>
            <h1>BSIS Registration</h1>
        </header>

        <nav>
            Home | Registration
        </nav>

        <div class="card">
            <h2> Student Registration</h2>

        <div class="notice">
            Please Fill out the form.
        </div>

        <form action="success.html">
        
            <div class="form-group">
            <label>Name:</label>
            <input type="text">
        </div>

        <div class="form-group">
            <label>Student ID:</label>
            <input type="text">
        </div>

        <div class="form-group">
            <label>Year:</label>
            <select>
                <option>1st Year</option>
                <option>2nd Year</option>
                <option>3rd Year</option>
                <option>4th Year</option>
            </select>
        </div>

        <button type="Submit">Register</button>
        <button type="Reset">Remove</button>
        </form>
        
        <table>
            <tr>
                <th>Year</th>
                <th>Status</th>
            </tr>
            <tr>
                <td>1st Year</td>
                <td>Closed</td>
            </tr>
            <tr>
                <td>2nd Year</td>
                <td>Open</td>
            </tr>
        </table>
        <script src="app.js"></script>
    </body>
</html>
