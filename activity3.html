<!DOCTYPE html>
<html lang="eng">
    <head>
        <meta charset="UTF=8">
        <meta name="viewport"
        content="width=device-width", initial-scale=1.0">
        <title>Student Registration</title>

        <style>
            *{box-sizing: border-box;
            }
            body {
                margin: 0;
                background: f7f7f7;
                font-family: Arial, Helvetica, sans-serif;
                color:#333;
            }


            .container {
                width: 960px;
                margin: 25px auto;
                background: white;
                padding: 20px 35px 45px;
                border-radius: 5px;
                box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
            }
            h1 {
                margin: 0 0 25px;
                text-align: center;
                font-size: 28px;
                font-weight: 600;
                color:#3478d4;
            }
            .form-row {
                display: grid;
                grid-template-columns:180px 1fr;
                align-items: center;
                margin-bottom: 14px;
            }
            label {
                font-size: 16px;
                font-weight: 400;
            }
            input, select{
                width: 100px;
                height: 43px;
                padding: 0 12px;
                border: 1px solid #ddd;
                border-radius: 4px;
                background: #fff;
                font-size: 15px;
                color:#555;
                outline: none;
            }

            select {
                cursor: pointer;
            }

            input::focus, select:focus {
                border-color: #aaa;
            }
            
            input::placeholder {
                color: #999
            }

            /*for button */
            .add-button {
                width: 100px;
                height: 46px;
                margin-top: 4px;
                border: none;
                border-radius: 5px;
                background: #3478d4;
                color: white;
                font-size: 16px;
                font-weight: bold;
                cursor: pointer;
            }

            .add-button:hover {
                background: #3478d4;
            }
            /*Registered student*/
            h2 {
                margin: 20px 0 15px;
                font-size: 27px;
                font-weight: 400;
                color: #444;
            }

            table {
                width: 100;
                border-collapse: collapse;
                table-layout: fixed;
            }

            th {
                height: 47px;
                padding: 0 12px;
                background: #3478d4;
                color: white;
                text-align: left;
                font-size: 15px;
                font-weight: bold;
            }

            td {
                padding: 15px 12px;
                border-bottom: 1px solid #eee;
                font-size: 15px;
            }

            .empty {
                text-align: center;
                color: #777;
                padding: 22px;
            }

            th:nth-child(1),
            td:nth-child(1) {width: 26px;}

            th:nth-child(2),
            td:nth-child(2) {width: 18px;}

            th:nth-child(3),
            td:nth-child(3) {width: 21px;}

            th:nth-child(4),
            td:nth-child(4) {width: 15px;}

            th:nth-child(5),
            td:nth-child(5) {width: 20px;}

            @media (max-width: 1000px) {.container {width: calc(100% - 40px);
            }}

            @media (max-width: 650px) {.container {width: calc(100% - 20px);
                padding: 20px;}}

            .form-row {
                display:block;
            }

            label {
                display: block;
                margin-bottom: 6px;
            }

            input, select {
                margin-bottom: 8px;

            }

            table{
                font-size: 12px;
            }

            th, td {
                padding: 8px 5px;
            }


        </style>
    </head>

    <body>
        <div class="container">
            <h1>Student Registration</h1>
            <form>
                <div class="form-row">
                    <label>First Name</label>
                    <input type="text">
                </div>

                <div class="form-row">
                    <label>Middle Name</label>
                    <input type="text">
                </div>

                <div class="form-row">
                    <label>Last Name</label>
                    <input type="text">
                </div>

                <div class="form-row">
                    <label>Email Address</label>
                    <input type="email">
                </div>
                
                <div class="form-row">
                    <label>Year Level</label>
                    <select>
                        <option> Select Year Level</option>
                    <option>1st Year</option>
                    <option>2nd Year</option>
                    <option>3rd Year</option>
                    <option>4th Year</option>
                    </select>

                <div class="form-row">
                    <label>Section</label>
                    <input type="text" placeholder="Example: BSIS 2-1">

                    <button class="add-button" type="button">
                        Add Student
                        </button>
                    </div>
            </form>

            <h2> Registered Students</h2>
            <table>
                <thead>
                    <tr>
                        <th>Full Name</th>
                        <th>Email</th>
                        <th>Course</th>
                        <th>Section</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="5" class="empty">No Student Registered yet.

                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </body>
</html>
